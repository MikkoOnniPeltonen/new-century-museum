<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Century Museum - A Journey Through Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'slide-left': 'slideLeft 0.8s ease-out forwards',
                        'explode-in': 'explodeIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
                        'glow-flash': 'glowFlash 1.5s ease-in-out forwards',
                        'pulse-glow': 'pulseGlow 0.8s ease-out forwards',
                        'fade-out': 'fadeOut 0.8s ease-out forwards',
                        'fall-fade': 'fallFade 0.8s ease-in forwards',
                        'shadow-reveal': 'shadowReveal 0.6s ease-out forwards',
                        'appear-final': 'appearFinal 1s ease-out forwards',
                        'footer-jump': 'footerJump 0.5s ease-out',
                    },
                    keyframes: {
                        slideLeft: {
                            'from': { opacity: '0', transform: 'translateX(100px)' },
                            'to': { opacity: '1', transform: 'translateX(0)' }
                        },
                        explodeIn: {
                            '0%': { opacity: '0', transform: 'scale(0) rotate(-180deg)', letterSpacing: '-20px' },
                            '70%': { transform: 'scale(1.2) rotate(10deg)', letterSpacing: '10px' },
                            '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)', letterSpacing: 'normal' }
                        },
                        glowFlash: {
                            '0%, 100%': { opacity: '0' },
                            '20%, 40%, 60%, 80%': { opacity: '1' }
                        },
                        pulseGlow: {
                            '0%': { opacity: '0', transform: 'scale(0.5)' },
                            '50%': { opacity: '1', transform: 'scale(1.3)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        fadeOut: {
                            'to': { opacity: '0', transform: 'translateY(-50px)' }
                        },
                        fallFade: {
                            'to': { opacity: '0', transform: 'translateY(100px) rotate(15deg)' }
                        },
                        shadowReveal: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        appearFinal: {
                            'from': { opacity: '0', transform: 'translateY(-30px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' }
                        },
                        footerJump: {
                            '0%': { transform: 'translateY(100%)' },
                            '50%': { transform: 'translateY(-20px)' },
                            '100%': { transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Century Room View - Museum</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Professional Components CSS -->
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../components/toast.css">
    <link rel="stylesheet" href="../components/modal.css">
    <link rel="stylesheet" href="../components/loading.css">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body id="room-view" class="bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100 min-h-screen">

    <!-- NAVBAR -->
    <header>
        <nav class="navbar bg-gradient-to-r from-cyan-600 to-blue-600 backdrop-blur-md bg-opacity-90 shadow-lg">
            <div class="container mx-auto px-4 py-3">
                <div class="flex items-center justify-between w-full">
                    <a href="../index.html" class="flex items-center space-x-3 text-white hover:text-cyan-200 transition-colors">
                        <img src="../images/logo/logo_of_the_Century_museum.jpg" alt="logo" class="w-12 h-9 rounded-lg shadow-md">
                        <span class="text-xl font-bold">Century Museum</span>
                    </a>
                    <div class="hidden md:flex space-x-6 ml-auto">
                        <a href="../index.html" class="text-white hover:text-cyan-200 transition-colors font-medium">Home</a>
                        <a href="#" class="text-white hover:text-cyan-200 transition-colors font-medium">Features</a>
                        <a href="#footer" class="text-white hover:text-cyan-200 transition-colors font-medium">Contact us</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- PERSONS SELECTED TO THE ROOM -->
    <section id="category-of-persons-of-century" class="container mx-auto px-4 py-12">
        <div class="room-header flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <span><a id="backToPersonsLink" class="cursor-pointer hover:scale-110 transition-transform inline-block">
                <h1 id="century" class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600"></h1>
            </a></span>
            <button id="play-game-btn" class="group relative px-8 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-lg font-bold rounded-full shadow-lg hover:shadow-2xl transform hover:scale-105 transition-all duration-300 overflow-hidden">
                <span class="absolute inset-0 bg-gradient-to-r from-pink-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                <span class="relative flex items-center gap-3">
                    <span class="text-2xl animate-pulse">🎮</span>
                    <span>Play Memory Game</span>
                </span>
            </button>
        </div>

        <div id="persons-on-display" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div id="message-container" class="hidden text-center mt-20">
            <div class="inline-block bg-white rounded-2xl shadow-2xl p-12">
                <div class="text-6xl mb-4">🏛️</div>
                <p class="text-2xl text-gray-700 font-semibold">Your room is empty!</p>
                <p class="text-lg text-gray-500 mt-4">Start adding historical figures to bring this century to life.</p>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer" class="mt-8 bg-gradient-to-r from-gray-900 to-gray-800 backdrop-blur-md bg-opacity-95 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] text-white py-3">
        <div class="container mx-auto px-4">
            <div class="social-media flex justify-center items-center gap-4">
                <span class="text-xs text-gray-400">Follow us:</span>
                <a href="https://www.facebook.com/?" class="hover:opacity-80 transition-opacity" aria-label="Facebook">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="w-4 h-4 object-contain">
                </a>
                <a href="https://x.com/?lang=eng" class="hover:opacity-80 transition-opacity" aria-label="Twitter">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/X_logo_2023.svg/240px-X_logo_2023.svg.png" alt="Twitter" class="w-4 h-4 object-contain">
                </a>
                <a href="https://www.instagram.com/" class="hover:opacity-80 transition-opacity" aria-label="Instagram">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" class="w-4 h-4 object-contain">
                </a>
            </div>
        </div>
    </footer>

    <script src="../roomClass.js" type="module"></script>
    <script src="./roomViewPage.js" type="module"></script>
</body>
</html>

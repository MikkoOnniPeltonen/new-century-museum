<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Historical Persons - Century Museum</title>

    <!-- Bootstrap CSS for carousel -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Professional Components CSS -->
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../components/modal.css">
    <link rel="stylesheet" href="../components/loading.css">
    <link rel="stylesheet" href="../styles/styles.css">

    <style>
        /* Remove Bootstrap carousel overflow */
        .carousel {
            overflow: visible !important;
        }

        /* Carousel container with centered active item and side previews */
        .carousel-inner {
            display: flex !important;
            align-items: center;
            justify-content: center;
            overflow: visible !important;
            padding: 1rem 0;
            position: relative;
            height: 450px;
        }

        .carousel-item {
            position: absolute !important;
            height: 350px;
            width: 45%;
            max-width: 350px;
            left: 50%;
            transition: all 0.6s ease-in-out !important;
            opacity: 0;
            transform: translateX(-50%) scale(0.7);
            filter: blur(3px);
            pointer-events: none;
            display: flex !important;
            flex-direction: column;
        }

        /* Previous item - left side */
        .carousel-item.active.carousel-item-start,
        .carousel-item.carousel-item-prev:not(.carousel-item-end) {
            opacity: 0.4;
            transform: translateX(-170%) scale(0.7);
            filter: blur(2px);
            z-index: 1;
        }

        /* Active centered item */
        .carousel-item.active:not(.carousel-item-start):not(.carousel-item-end) {
            opacity: 1 !important;
            transform: translateX(-50%) scale(1) !important;
            filter: blur(0) !important;
            z-index: 3;
            pointer-events: auto;
        }

        /* Next item - right side */
        .carousel-item.active.carousel-item-end,
        .carousel-item.carousel-item-next:not(.carousel-item-start) {
            opacity: 0.4;
            transform: translateX(70%) scale(0.7);
            filter: blur(2px);
            z-index: 1;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            background: transparent;
        }

        /* Make carousel items transparent to show background */
        .carousel-item {
            background: transparent !important;
        }

        /* Make captions always visible with fade effect */
        .carousel-caption {
            display: block !important;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            bottom: 1rem;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            width: 90%;
            max-width: 350px;
            animation: fadeInCaption 0.8s ease-in-out;
        }

        @keyframes fadeInCaption {
            from {
                opacity: 0;
                background: rgba(0, 0, 0, 0.65);
            }
            to {
                opacity: 1;
                background: rgba(0, 0, 0, 0.45);
            }
        }

        .carousel-caption h5 {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
            color: white;
        }

        .carousel-caption p {
            font-size: 0.85rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Carousel indicators styling */
        .carousel-indicators {
            position: relative !important;
            bottom: auto !important;
            margin-top: 1rem;
        }

        .carousel-indicators button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #94a3b8;
            opacity: 0.6;
            border: none;
        }

        .carousel-indicators button.active {
            opacity: 1;
            background-color: #0ea5e9;
        }

        /* Person chosen badge */
        .person-chosen {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #10b981;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        /* Control buttons */
        .carousel-control-prev,
        .carousel-control-next {
            z-index: 10 !important;
        }

        @media (min-width: 768px) {
            .carousel-item {
                height: 380px;
                max-width: 380px;
            }

            .carousel-caption h5 {
                font-size: 1.25rem;
            }

            .carousel-caption p {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 767px) {
            .carousel-item {
                width: 70%;
                max-width: 280px;
                height: 320px;
            }

            .carousel-inner {
                height: 380px;
            }

            .carousel-item.active.carousel-item-start,
            .carousel-item.carousel-item-prev:not(.carousel-item-end) {
                transform: translateX(-150%) scale(0.6);
            }

            .carousel-item.active.carousel-item-end,
            .carousel-item.carousel-item-next:not(.carousel-item-start) {
                transform: translateX(50%) scale(0.6);
            }
        }
    </style>
</head>
<body id="persons-page" class="bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100 min-h-screen">

    <!-- NAVBAR -->
    <header>
        <nav class="navbar bg-gradient-to-r from-cyan-600 to-blue-600 backdrop-blur-md bg-opacity-90 shadow-lg">
            <div class="container mx-auto px-4 py-3">
                <div class="flex items-center justify-between w-full">
                    <a href="../index.html" class="flex items-center space-x-3 text-white hover:text-cyan-200 transition-colors">
                        <img src="../images/logo/logo_of_the_Century_museum.jpg" alt="logo" class="w-12 h-9 rounded-lg shadow-md">
                        <span class="text-xl font-bold">Century Museum</span>
                    </a>
                    <div class="hidden md:flex space-x-6 ml-auto">
                        <a href="../index.html" class="text-white hover:text-cyan-200 transition-colors font-medium">Home</a>
                        <a href="#" class="text-white hover:text-cyan-200 transition-colors font-medium">Features</a>
                        <a href="#footer" class="text-white hover:text-cyan-200 transition-colors font-medium">Contact us</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- SELECT PERSONS -->
    <section id="overview-of-persons-container" class="container mx-auto px-4 py-6 flex flex-col items-center">
        <div class="text-center mb-4">
            <h4 class="text-lg md:text-xl font-bold text-gray-800 mb-2">We are glad that you have chosen to explore more!</h4>
            <p class="text-sm md:text-base text-gray-600">Discover the remarkable people who shaped this century.</p>
        </div>

        <div id="welcome-text" class="text-center mb-6 max-w-4xl">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">
                Welcome! Select historical figures for the
                <span id="changing-century-text" class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600 cursor-pointer hover:scale-110 transition-transform inline-block"></span>
                century room
            </h1>
            <h6 class="text-xs text-gray-500 italic">Click the century link to view your room</h6>
        </div>

        <div id="historical-persons-selection" class="w-full max-w-6xl">
            <!-- Notification -->
            <div id="notification-container" class="hidden fixed top-24 right-4 z-50 bg-gradient-to-r from-cyan-500 to-blue-500 text-white px-6 py-4 rounded-lg shadow-2xl transform transition-all duration-300">
                <p id="notification-message" class="font-semibold"></p>
            </div>

            <!-- Carousel -->
            <div id="myCarousel" class="carousel slide relative mb-8" data-bs-interval="false">
                <div class="carousel-inner relative"></div>
                <div class="carousel-indicators flex gap-2 justify-center"></div>

                <button class="carousel-control-prev absolute left-4 top-1/2 transform -translate-y-1/2 bg-white/30 hover:bg-white/50 backdrop-blur-md rounded-full p-4 transition-all z-10" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next absolute right-4 top-1/2 transform -translate-y-1/2 bg-white/30 hover:bg-white/50 backdrop-blur-md rounded-full p-4 transition-all z-10" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <!-- Action Buttons -->
            <div id="persons-action-container" class="flex flex-col md:flex-row justify-center gap-3 mb-16">
                <button id="add-person-btn" class="px-5 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white text-sm font-bold rounded-full shadow-lg hover:shadow-xl hover:scale-105 transform transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                    ✓ Add Person
                </button>
                <button id="remove-person-btn" class="px-5 py-2.5 bg-gradient-to-r from-red-500 to-rose-600 text-white text-sm font-bold rounded-full shadow-lg hover:shadow-xl hover:scale-105 transform transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                    ✕ Remove Person
                </button>
                <button id="clear-persons-btn" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-orange-600 text-white text-sm font-bold rounded-full shadow-lg hover:shadow-xl hover:scale-105 transform transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                    ⟳ Clear All
                </button>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer" class="mt-20 bg-gradient-to-r from-gray-900 to-gray-800 backdrop-blur-md bg-opacity-95 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] text-white py-3">
        <div class="container mx-auto px-4">
            <div class="social-media flex justify-center items-center gap-4">
                <span class="text-xs text-gray-400">Follow us:</span>
                <a href="https://www.facebook.com/?" class="hover:opacity-80 transition-opacity" aria-label="Facebook">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="w-4 h-4 object-contain">
                </a>
                <a href="https://x.com/?lang=eng" class="hover:opacity-80 transition-opacity" aria-label="Twitter">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/X_logo_2023.svg/240px-X_logo_2023.svg.png" alt="Twitter" class="w-4 h-4 object-contain">
                </a>
                <a href="https://www.instagram.com/" class="hover:opacity-80 transition-opacity" aria-label="Instagram">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" class="w-4 h-4 object-contain">
                </a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS for carousel functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../roomClass.js" type="module"></script>
    <script src="./historicalPersonsPage.js" type="module"></script>
</body>
</html>
